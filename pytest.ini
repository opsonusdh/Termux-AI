[pytest]
# The permanent suite lives in tests/ (see CONTRIBUTING.md).  Saying so here
# keeps a bare ``pytest`` at the repository root from wandering into the
# gitignored workspace/ scratch area — where the backup copies of old test
# files live and where a duplicate basename makes collection blow up with
# an "import file mismatch" error.
testpaths = tests
norecursedirs = .git workspace logs data Termux-WP Termux-STT instructions *.egg
